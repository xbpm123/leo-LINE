<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ラブコード診断</title>
<meta name="description" content="恋の不安のクセ×愛情の受け取り方で、あなたの恋愛をコードにする診断。30問・約5分。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<main class="wrap" id="app"></main>
<script src="data.js"></script>
<script>
  // 本番用：Cloudflare Pages Functions の API を叩く
  window.LC_API = {
    demo: false,
    plans: function () { return fetch('/api/plans').then(function (r) { return r.json(); }); },
    checkout: function (order) {
      return fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order) })
        .then(function (r) { return r.json(); });
    },
    report: function (sessionId) {
      return fetch('/api/report?session_id=' + encodeURIComponent(sessionId)).then(function (r) { return r.json(); });
    }
  };
</script>
<script src="app.js"></script>
<!--/APP-->
</body>
</html>
