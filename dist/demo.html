<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラム（最大680px）。診断は1問1カード、結果は「コード札」を頂点に縦に積む */
:root {
  --bg: #f3f1f7;
  --surface: #ffffff;
  --ink: #251e35;
  --muted: #6b6480;
  --line: #dcd6e8;
  --accent: #d6416c;
  --accent-ink: #ffffff;
  --accent-soft: #fbe4eb;
  --q-co: #c97a12;
  --q-eo: #d6416c;
  --q-ck: #2f72b8;
  --q-ek: #7651c2;
  --display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16121e; --surface: #211b2c; --ink: #efebf6; --muted: #a79fba; --line: #3a3149;
    --accent: #ff7598; --accent-ink: #1a0f16; --accent-soft: #3d1f2b;
    --q-co: #f0aa4a; --q-eo: #ff7598; --q-ck: #6aa8ea; --q-ek: #a98af0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16121e; --surface: #211b2c; --ink: #efebf6; --muted: #a79fba; --line: #3a3149;
  --accent: #ff7598; --accent-ink: #1a0f16; --accent-soft: #3d1f2b;
  --q-co: #f0aa4a; --q-eo: #ff7598; --q-ck: #6aa8ea; --q-ek: #a98af0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; padding-block: 32px 64px; display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 700;
  background: var(--accent); color: var(--accent-ink);
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 16px; font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border-radius: 20px; padding: 24px; display: grid; gap: 14px; }

/* ---------- intro ---------- */
.hero { display: grid; gap: 18px; padding-top: 16px; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 9vw, 56px); letter-spacing: .02em; }
.hero h1 small { display: block; font-family: var(--body); font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .1em; }
.hero .lead { font-size: 17px; max-width: 34em; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.anatomy { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.anatomy .slot { flex: 1 1 64px; min-width: 0; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; display: grid; gap: 2px; }
.anatomy .slot b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.anatomy .slot span { font-size: 11px; color: var(--muted); line-height: 1.5; }
.anatomy .dash { align-self: center; font-family: var(--display); font-size: 24px; color: var(--muted); }
.anatomy .slot.ll { border-color: var(--accent); }

.typegrid { display: grid; gap: 18px; }
.typerow { display: grid; gap: 8px; }
.typerow h3 { font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.typerow h3 .base { font-size: 12px; color: var(--muted); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { border: 0; text-align: left; background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 2px; border-top: 4px solid var(--qc); }
.tile code { font-family: var(--display); font-size: 14px; color: var(--qc); }
.tile strong { font-size: 15px; line-height: 1.4; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.5; }

.viewer { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.viewer label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
select, input[type="text"] {
  font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 8px 10px; min-width: 0;
}

.note { font-size: 13px; color: var(--muted); line-height: 1.7; }
.foot { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; }
.foot a { color: var(--muted); }
.demo-banner { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; }

/* ---------- quiz ---------- */
.progress { display: grid; gap: 6px; }
.progress .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qcard { background: var(--surface); border-radius: 24px; padding: 32px 24px; display: grid; gap: 28px; min-height: 300px; align-content: center; }
.qcard .qtext { font-size: 21px; font-weight: 700; line-height: 1.6; text-wrap: balance; text-align: center; }
.likert { display: grid; gap: 10px; }
.likert .dots { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.likert .dots button { border: 2px solid var(--line); background: transparent; border-radius: 50%; padding: 0; flex: none; }
.likert .dots button:nth-child(1), .likert .dots button:nth-child(5) { width: 52px; height: 52px; }
.likert .dots button:nth-child(2), .likert .dots button:nth-child(4) { width: 42px; height: 42px; }
.likert .dots button:nth-child(3) { width: 34px; height: 34px; }
.likert .dots button.on, .likert .dots button:hover { background: var(--accent); border-color: var(--accent); }
.likert .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.choices { display: grid; gap: 12px; }
.choices button { border: 2px solid var(--line); background: transparent; border-radius: 16px; padding: 16px 18px; text-align: left; font-weight: 500; line-height: 1.6; }
.choices button.on, .choices button:hover { border-color: var(--accent); background: var(--accent-soft); }
.qnav { display: flex; justify-content: space-between; align-items: center; }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- result ---------- */
.codecard { background: var(--surface); border-radius: 24px; padding: 28px 24px; display: grid; gap: 10px; border-top: 8px solid var(--qc); }
.codecard .code { font-family: var(--display); font-size: clamp(34px, 10vw, 64px); line-height: 1.1; letter-spacing: .04em; color: var(--qc); white-space: nowrap; }
.codecard .code em { font-style: normal; color: var(--accent); }
.codecard h2 { font-size: 26px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; border-radius: 999px; padding: 3px 12px; background: var(--bg); font-weight: 700; }
.chip.att { background: var(--qc); color: var(--surface); }

.axes { display: grid; gap: 14px; }
.axis { display: grid; gap: 4px; }
.axis .names { display: flex; justify-content: space-between; font-size: 13px; }
.axis .names b { color: var(--accent); }
.axis .track { position: relative; height: 10px; background: var(--bg); border-radius: 99px; }
.axis .track i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
.axis .label { font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

.sec { display: grid; gap: 12px; }
.sec h3 { font-size: 19px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-family: var(--body); font-size: 11px; letter-spacing: .1em; border-radius: 6px; padding: 1px 8px; font-weight: 700; }
.tag.free { background: var(--bg); color: var(--muted); }
.tag.paid { background: var(--accent-soft); color: var(--accent); }
.kv { display: grid; gap: 10px; }
.kv div { display: grid; gap: 2px; }
.kv dt, .kv .k { font-size: 13px; font-weight: 700; color: var(--muted); }
.ask { border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--bg); border-radius: 0 10px 10px 0; display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.tips { margin: 0; padding: 0; list-style: none; counter-reset: tip; display: grid; gap: 12px; }
.tips li { counter-increment: tip; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; }
.tips li::before { content: counter(tip); font-family: var(--display); font-size: 18px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; line-height: 1; }
.lock { background: var(--surface); border-radius: 20px; padding: 28px 24px; display: grid; gap: 16px; border: 2px dashed var(--accent); }
.lock ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.lock .price { font-family: var(--display); font-size: 32px; }
.lock .price small { font-family: var(--body); font-size: 13px; color: var(--muted); }
.compat-form { display: flex; gap: 8px; flex-wrap: wrap; }
.compat-form input { flex: 1 1 160px; text-transform: uppercase; }
.compat-out { display: grid; gap: 10px; }
.err { color: var(--accent); font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- plans & long report ---------- */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: start; }
.plan { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px 18px; display: grid; gap: 10px; min-width: 0; }
.plan.star { border: 2px solid var(--accent); }
.plan h4 { margin: 0; font-size: 16px; line-height: 1.5; }
.plan .price { font-family: var(--display); font-size: 30px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.plan .price small { font-family: var(--body); font-size: 12px; color: var(--muted); }
.plan ul { margin: 0; padding-left: 1.1em; font-size: 14px; line-height: 1.7; display: grid; gap: 2px; }
.plan .btn { width: 100%; }
.plan input { width: 100%; text-transform: uppercase; }
.badge { position: absolute; top: -12px; left: 16px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 12px; }
.stack { display: grid; gap: 28px; }
.part { font-family: var(--display); font-weight: 400; font-size: 22px; padding-top: 8px; border-top: 1.5px solid var(--line); }
ul.dots { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.ask + .ask { margin-top: 6px; }
.ranking { display: grid; gap: 6px; }
.ranking details { background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.ranking summary { display: flex; gap: 10px; align-items: center; cursor: pointer; list-style: none; }
.ranking summary::-webkit-details-marker { display: none; }
.ranking code { font-family: var(--display); font-size: 13px; color: var(--muted); }
.ranking .nm { flex: 1; font-weight: 700; min-width: 0; }
.ranking .st { color: var(--accent); letter-spacing: .05em; }
.ranking .kv { padding-top: 8px; font-size: 14px; }
.pair-codes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--display); font-size: clamp(22px, 6vw, 32px); }
.pair-codes span { display: grid; }
.pair-codes small { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); }
.pair-codes b { font-weight: 400; color: var(--accent); }
.partner-report summary { cursor: pointer; list-style: none; display: grid; gap: 4px; }
.partner-report summary::-webkit-details-marker { display: none; }
.partner-report[open] summary { margin-bottom: 28px; }
.cgroup { display: grid; gap: 8px; }
.cgroup h4 { margin: 8px 0 0; font-size: 15px; }
.cgroup > p { font-size: 14px; color: var(--muted); }
.ranking details p { padding-top: 8px; font-size: 14px; }
.rephrase { display: grid; gap: 10px; }
.rephrase > div { display: grid; gap: 4px; background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.rephrase .before { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
.rephrase .after { font-weight: 700; }
.rephrase .after::before { content: "→ "; color: var(--accent); }
.ask .who { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.guide-text { white-space: pre-wrap; font: inherit; background: var(--bg); border-radius: 10px; padding: 12px; margin: 0; }
.qa { display: grid; gap: 14px; }
.qa > div { display: grid; gap: 4px; }
.qa .q { font-weight: 700; }
.qa .q::before { content: "Q. "; color: var(--accent); font-family: var(--display); }
.cgroup h4 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.cgroup h4 .st { color: var(--accent); font-size: 14px; letter-spacing: .05em; }
.ranking .near { font-size: 12px; color: var(--muted); white-space: nowrap; }

</style>

const CODE_RE = /^([CE])([OK])([FS])([HM])-([WTGAP])([WTGAP])?$/;
const TYPE_NAMES = {
  COFH: 'ひまわり', COFM: '船長', COSH: '縁側', COSM: '大樹', EOFH: '花火', EOFM: '名探偵', EOSH: '月見草', EOSM: '天気予報士',
  CKFH: '風来坊', CKFM: 'ソロキャンパー', CKSH: '黒猫', CKSM: '書斎の住人', EKFH: 'ジェットコースター', EKFM: '綱渡り師', EKSH: 'ハリネズミ', EKSM: '要塞'
};

const ATT_ORDER = ['CO', 'EO', 'CK', 'EK'];

function parseCode(code) {
  const m = CODE_RE.exec(code || '');
  if (!m || m[5] === m[6]) return null;
  return { core: m[1] + m[2] + m[3] + m[4], att: m[1] + m[2], pace: m[3] + m[4], ll: m[6] ? [m[5], m[6]] : [m[5]] };
}

const attPair = (a, b) => ATT_PAIR[[a, b].sort().join('-')];
const paceKey = (a, b) => (a[0] === b[0] ? (a[0] === 'F' ? 'sameF' : 'sameS') : 'diffF');
const judgeKey = (a, b) => (a[1] === b[1] ? (a[1] === 'H' ? 'sameH' : 'sameM') : 'diffH');

function lite(p) {
  const a = ATT[p.att];
  return {
    seen: TYPE_EXTRA[p.core].seen,
    step: TYPE_EXTRA[p.core].step,
    portrait: a.portrait,
    loop: a.loop,
    strengths: a.strengths,
    pitfalls: a.pitfalls,
    signs: a.signs,
    match: a.match,
    caution: a.caution,
    pace: { title: PACE[p.pace].title, body: PACE[p.pace].body, approach: PACE[p.pace].approach, date: PACE[p.pace].date, line: PACE[p.pace].line },
    ll: p.ll.map((k) => ({ key: k, need: LL[k].need, give: LL[k].give, starving: LL[k].starving, joys: LL[k].joys, giveTips: LL[k].giveTips, receive: LL[k].receive, phrases: LL[k].phrases })),
    cross: p.ll.map((k) => ({ key: k, text: CROSS[p.att][k] })),
    rephrase: a.rephrase,
    qa: QA[p.att].map(([q, ans]) => ({ q, a: ans })),
    dates: DATES[p.ll[0]],
    spot: COMMON.spot,
    change: COMMON.change,
    tips: a.tips.map(([t, why]) => ({ t, why })),
    selfcare: a.selfcare,
    // 恋人に見せる取扱説明書。「この人」は診断を受けた本人を指す
    guide: {
      att: a.guide,
      pace: PACE[p.pace].guide,
      ll: p.ll.map((k) => ({ name: LL_NAMES[k], action: LL[k].action }))
    }
  };
}

function standard(p) {
  const a = ATT[p.att];
  // 16タイプとの付き合いやすさ。愛着の組み合わせごとにまとめ、ペースと判断の違いで少し差をつける
  const groups = ATT_ORDER.map((att) => {
    const ap = attPair(p.att, att);
    const types = Object.keys(TYPE_NAMES).filter((core) => core.slice(0, 2) === att).map((core) => {
      const pace = core.slice(2);
      const score = ap.ease * 20 - (p.pace[0] === pace[0] ? 0 : 6) - (p.pace[1] === pace[1] ? 0 : 3);
      return { core, name: TYPE_NAMES[core], score, samePace: p.pace[0] === pace[0], sameJudge: p.pace[1] === pace[1], howto: TYPE_HOWTO[core] };
    }).sort((x, y) => y.score - x.score);
    return { att, ease: ap.ease, text: ap.text, types };
  }).sort((x, y) => y.ease - x.ease);
  return {
    crisis: a.crisis,
    fightRules: COMMON.fightRules,
    habits: ATT_MORE[p.att].habits,
    rut: RUT[p.pace],
    marriage: ATT_MORE[p.att].marriage,
    reunion: ATT_MORE[p.att].reunion,
    app: ATT_MORE[p.att].app,
    jealousy: a.jealousy,
    afterBreakup: a.afterBreakup,
    stages: a.stages,
    compat: groups,
    actions: Object.fromEntries(Object.entries(LL).map(([k, v]) => [k, v.action])),
    attPairs: Object.fromEntries(ATT_ORDER.map((att) => [att, attPair(p.att, att).text])),
    pacePairs: PACE_PAIR
  };
}

function together(p, o) {
  const deep = PAIR_DEEP[[p.att, o.att].sort().join('-')];
  const shared = p.ll.filter((k) => o.ll.includes(k));
  return {
    att: attPair(p.att, o.att).text,
    pace: PACE_PAIR[paceKey(p.pace, o.pace)],
    judge: PACE_PAIR[judgeKey(p.pace, o.pace)],
    gaps: deep.gaps,
    talks: deep.talks.map(([who, line]) => ({ who, line })),
    ritual: deep.ritual,
    ll: {
      shared: shared.map((k) => LL_NAMES[k]),
      summary: shared.length ? LL_PAIR_TIP.shared : LL_PAIR_TIP.none,
      toPartner: o.ll.map((k) => ({ name: LL_NAMES[k], action: LL[k].action })),
      toYou: p.ll.map((k) => ({ name: LL_NAMES[k], action: LL[k].action }))
    }
  };
}

// plan: 'lite' | 'standard' | 'pair'。pair のときは partner（相手のコード）が必要
function buildReport(code, plan = 'lite', partner = null) {
  const p = parseCode(code);
  if (!p) return null;
  const rep = { code, plan, lite: lite(p) };
  if (plan === 'standard' || plan === 'pair') rep.standard = standard(p);
  if (plan === 'pair') {
    const o = parseCode(partner);
    if (!o) return null;
    rep.partner = { code: partner, lite: lite(o), standard: standard(o) };
    rep.together = together(p, o);
  }
  return rep;
}

  report: function (sid) { var s = sid.split('|'); return Promise.resolve(buildReport(s[1], s[2], s[3] || null)); }

      footer();

    document.getElementById('start').onclick = startQuiz;
    var r = document.getElementById('random');
    if (r) r.onclick = function () {
      state.likert = LC.LIKERT.map(function () { return 1 + Math.floor(Math.random() * 5); });

  function slot(big, small, cls) { return '<div class="slot ' + (cls || '') + '"><b>' + big + '</b><span>' + small + '</span></div>'; }
  function footer() {
    if (API.demo) return '';
    return '<nav class="foot"><a href="legal.html">特定商取引法に基づく表記</a><a href="legal.html#privacy">プライバシーポリシー</a></nav>';
  }

  // ---------- quiz ----------
  function startQuiz() { state = { likert: [], pairs: [], i: 0 }; renderQuestion(); }

  function renderQuestion() {
    var i = state.i, isPair = i >= LC.LIKERT.length;
    var body;
    if (!isPair) {
      var cur = state.likert[i];
      body = '<p class="eyebrow">あてはまる？</p><p class="qtext">' + LC.LIKERT[i].q + '</p>' +
        '<div class="likert"><div class="dots">' + [1, 2, 3, 4, 5].map(function (v) {
          var label = ['そう思わない', 'あまりそう思わない', 'どちらでもない', 'ややそう思う', 'そう思う'][v - 1];
          return '<button data-v="' + v + '" aria-label="' + label + '"' + (cur === v ? ' class="on"' : '') + '></button>';
        }).join('') + '</div><div class="ends"><span>そう思わない</span><span>そう思う</span></div></div>';
    } else {
      var p = LC.PAIRS[i - LC.LIKERT.length], c = state.pairs[i - LC.LIKERT.length];
      body = '<p class="eyebrow">恋人にされて、より嬉しいのは？</p>' +
        '<div class="choices"><button data-v="a"' + (c === 'a' ? ' class="on"' : '') + '>' + p.qa + '</button><button data-v="b"' + (c === 'b' ? ' class="on"' : '') + '>' + p.qb + '</button></div>';
    }
    app.innerHTML =
      '<div class="progress"><div class="meta"><span>' + (isPair ? 'パート2 愛情言語' : 'パート1 恋のクセ') + '</span><span>' + (i + 1) + ' / ' + TOTAL + '</span></div>' +
      '<div class="bar"><i style="width:' + Math.round((i / TOTAL) * 100) + '%"></i></div></div>' +
      '<section class="qcard">' + body + '</section>' +
      '<div class="qnav"><button class="linkbtn" id="back">' + (i === 0 ? 'トップに戻る' : 'ひとつ前へ') + '</button></div>';

    Array.prototype.forEach.call(app.querySelectorAll('.qcard button'), function (b) {
      b.onclick = function () {
        if (isPair) state.pairs[i - LC.LIKERT.length] = b.dataset.v; else state.likert[i] = Number(b.dataset.v);
        b.classList.add('on');
        setTimeout(function () { if (state.i + 1 >= TOTAL) finish(); else { state.i += 1; renderQuestion(); } }, 160);
      };
    });
    document.getElementById('back').onclick = function () { if (state.i === 0) renderIntro(); else { state.i -= 1; renderQuestion(); } };
  }

  function finish() {
    var r = LC.score(state.likert, state.pairs);
    save('lc_last', { code: r.code, pct: r.pct });
    showResult(r.code, r.pct);
  }

  // ---------- result ----------
  function showResult(code, pct) {
    var p = LC.parseCode(code);
    if (!p) return renderIntro();
    if (!pct) { var last = load('lc_last', null); if (last && last.code === code) pct = last.pct; }
    setHash(code);
    var t = LC.TYPES[p.core], a = LC.ATT[p.att];

    var axes = pct ? '<section class="panel axes"><span class="eyebrow">あなたの傾き</span>' + LC.AXES.map(function (ax, i) {
      var v = pct[i], toPos = v > 50, w = Math.abs(v - 50);
      return '<div class="axis"><div class="names"><span>' + (toPos ? ax.negName : '<b>' + ax.negName + '</b>') + '</span><span>' + (toPos ? '<b>' + ax.posName + '</b>' : ax.posName) + '</span></div>' +
        '<div class="track"><i style="left:' + (toPos ? 50 : 50 - w) + '%;width:' + Math.max(w, 1.5) + '%"></i></div>' +
        '<div class="label">' + ax.label + '　' + (toPos ? ax.posName : ax.negName) + ' ' + Math.max(v, 100 - v) + '%</div></div>';
    }).join('') + '</section>' : '';

    app.innerHTML =
      '<section class="codecard" style="--qc:' + ATT_COLOR[p.att] + '">' +
      '<span class="eyebrow">あなたのラブコード</span>' +
      '<div class="code">' + p.core + '<em>-' + p.ll.join('') + '</em></div>' +
      '<h2>' + t[0] + '</h2><p>' + t[1] + '</p>' +
      '<div class="chips"><span class="chip att">' + a.name + '</span>' + p.ll.map(function (k, i) { return '<span class="chip">' + (i ? 'サブ ' : 'メイン ') + LC.LL[k].name + '</span>'; }).join('') + '</div>' +
      '</section>' +
      axes +
      '<section class="sec"><h3>' + a.name + 'のあなた <span class="tag free">無料</span></h3><p>' + a.body + '</p></section>' +
      '<section class="sec"><h3>' + t[0] + 'の物語 <span class="tag free">無料</span></h3><p>' + LC.STORY[p.core] + '</p></section>' +
      '<section class="sec"><h3>' + t[0] + 'の恋愛あるある <span class="tag free">無料</span></h3>' + list(LC.ARUARU[p.core]) + '</section>' +
      '<section class="sec"><h3>あなたに響く愛情言語 <span class="tag free">無料</span></h3><dl class="kv">' + p.ll.map(function (k) {
        return '<div><dt>' + LC.LL[k].name + '（' + LC.LL[k].en + '）</dt><dd style="margin:0">' + LC.LL[k].short + '</dd></div>';
      }).join('') + '</dl></section>' +
      '<div id="premium"></div><div id="upgrade"></div>' +
      '<div class="actions" style="display:flex;flex-wrap:wrap;gap:12px">' +
      '<button class="btn ghost small" id="share">結果をコピー</button><button class="btn ghost small" id="again">もう一度診断する</button><button class="btn ghost small" id="top">トップへ</button></div>' +
      footer();

    document.getElementById('again').onclick = startQuiz;
    document.getElementById('top').onclick = renderIntro;
    document.getElementById('share').onclick = function (e) {
      var text = '私のラブコードは ' + code + '「' + t[0] + '」でした。' + t[1] + '。 #ラブコード診断';
      var btn = e.currentTarget;
      var done = function () { btn.textContent = 'コピーしました'; };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { btn.textContent = text; });
      else btn.textContent = text;
    };

    var owned = getPaid(code);
    if (owned) loadPremium(code, owned); else renderPlans(code, null);
    window.scrollTo(0, 0);
  }

  // ---------- 購入 ----------
  var PLAN_INFO = {
    lite: { name: 'ライト', lead: '自分の取扱説明書', items: ['恋人から見たあなたと、今週からできる一歩', '恋の強み・つまずき・要注意サイン', '合う恋人と、気をつけたい相手', '恋のペース、アプローチ、デート、LINE', '愛情言語の取扱説明、もらって嬉しいことリスト、おすすめのデート', '相手の愛情言語の見分け方', 'つい言ってしまう一言の言い換え', '恋のQ&A', 'うまくいくための5つのことと、セルフケア', '恋人に見せる取扱説明書'] },
    standard: { name: 'スタンダード', lead: 'ライトの全部＋恋の実践編', items: ['ライトの内容すべて', 'ケンカのパターンと、ケンカ中にやらないほうがいいこと', '仲直りの4ステップと、ケンカの基本ルール', '長続きする二人の習慣と、マンネリしたとき', '嫉妬、失恋、復縁', '同棲・結婚を考えたとき', 'マッチングアプリでの恋', '片思い・付き合いたて・長く付き合っている時期のアドバイス', '16タイプとの付き合いやすさと、付き合うときのコツ', '相手のコードを入れて見る相性チェック'] },
    pair: { name: 'ペア', lead: '2人分＋2人だけの相性レポート', items: ['あなたと相手、2人分のスタンダード', '2人の間で起きやすいズレの具体例', 'そのまま使える会話のテンプレ', '2人の愛情言語の届け方', '2人におすすめの習慣'] }
  };
  var PLAN_KEYS = ['lite', 'standard', 'pair'];
  var plans = null;

  function getPaid(code) {
    var v = load('lc_paid', {})[code];
    if (!v) return null;
    return typeof v === 'string' ? { sid: v, plan: 'lite' } : v;
  }
  function savePaid(code, sid, plan) {
    var paid = load('lc_paid', {}), cur = paid[code];
    var curRank = cur && cur.plan && plans ? plans[cur.plan].rank : 0;
    if (!plans || !cur || plans[plan].rank >= curRank) { paid[code] = { sid: sid, plan: plan }; save('lc_paid', paid); }
  }
  function yen(n) { return n.toLocaleString('ja-JP'); }

  // owned: 購入済みのプラン（なければ null）。上のプランだけを差額で並べる
  function renderPlans(code, owned) {
    var el = document.getElementById(owned ? 'upgrade' : 'premium');
    var ownedRank = owned ? plans[owned.plan].rank : 0;
    var keys = PLAN_KEYS.filter(function (k) { return plans[k].rank > ownedRank; });
    if (!keys.length) { el.innerHTML = ''; return; }
    var cards = keys.map(function (k) {
      var info = PLAN_INFO[k], price = plans[k].price - (owned ? plans[owned.plan].price : 0);
      var star = k === 'standard' && !owned;
      return '<div class="plan' + (star ? ' star' : '') + '">' +
        (star ? '<span class="badge">いちばん人気</span>' : '') +
        '<span class="eyebrow">' + info.name.toUpperCase() + '</span>' +
        '<h4>' + info.lead + '</h4>' +
        '<div class="price">' + yen(price) + '<small> 円（税込）' + (owned ? '・差額' : '') + '</small></div>' +
        (k === 'pair' ? '<p class="note">1人あたり ' + yen(plans.pair.price / 2) + '円</p>' : '') +
        '<ul>' + info.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
        (k === 'pair' ? '<label class="note" for="pair-partner">相手のラブコード（先に相手にも無料診断してもらってね）</label><input type="text" id="pair-partner" placeholder="例：CKSM-A" autocomplete="off">' : '') +
        '<button class="btn' + (star ? '' : ' ghost') + '" data-plan="' + k + '">' + (owned ? info.name + 'にアップグレード' : info.name + 'を購入') + '</button>' +
        '</div>';
    }).join('');
    el.innerHTML = '<section class="sec"><span class="eyebrow">' + (owned ? 'もっと読む' : '詳しいレポート') + '</span>' +
      '<h3>' + (owned ? '差額だけで、上のプランにアップグレードできます' : '恋をうまくいかせるための、あなた専用の取扱説明書') + '</h3>' +
      '<div class="plans">' + cards + '</div><p class="err" id="buy-err" hidden></p>' +
      '<p class="note">買い切りです。クレジットカード、Apple Pay、Google Pay に対応。決済は Stripe で安全に処理されます。</p></section>';

    Array.prototype.forEach.call(el.querySelectorAll('button[data-plan]'), function (btn) {
      btn.onclick = function () {
        var plan = btn.dataset.plan, err = document.getElementById('buy-err'), partner = null;
        if (plan === 'pair') {
          partner = normalize(document.getElementById('pair-partner').value);
          if (!LC.parseCode(partner)) { err.hidden = false; err.textContent = '相手のコードを「CKSM-A」のような形で入力してください。'; return; }
        }
        var label = btn.textContent;
        btn.disabled = true; btn.textContent = '決済ページを準備中…'; err.hidden = true;
        API.checkout({ code: code, plan: plan, partner: partner, upgradeFrom: owned ? owned.sid : null }).then(function (res) {
          if (res.url) { location.href = res.url; return; }
          if (res.sessionId) { savePaid(code, res.sessionId, plan); showResult(code, null); return; }
          throw new Error(res.error || '決済ページを開けませんでした');
        }).catch(function (x) {
          btn.disabled = false; btn.textContent = label;
          err.hidden = false; err.textContent = x.message;
        });
      };
    });
  }

  function loadPremium(code, owned) {
    var el = document.getElementById('premium');
    el.innerHTML = '<p class="muted">レポートを読み込んでいます…</p>';
    API.report(owned.sid).then(function (rep) {
      if (!rep || rep.error) throw new Error((rep && rep.error) || 'レポートを読み込めませんでした');
      renderPremium(code, rep);
      renderPlans(code, { sid: owned.sid, plan: rep.plan });
    }).catch(function (x) {
      el.innerHTML = '<p class="err">' + x.message + '</p>';
    });
  }

  function normalize(raw) { return (raw || '').trim().toUpperCase().replace(/[－ー―‐]/g, '-'); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  function tag(plan) { return ' <span class="tag paid">' + PLAN_INFO[plan].name + '</span>'; }
  function list(items, cls) { return '<ul class="' + (cls || 'dots') + '">' + items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
  function kv(label, body) { return '<div><span class="k">' + label + '</span>' + (body.charAt(0) === '<' ? body : '<p>' + body + '</p>') + '</div>'; }
  function stars(score) { var n = Math.max(1, Math.min(5, Math.round(score / 20))); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }

    var lines = ['【' + LC.TYPES[p.core][0] + '（' + p.core + '-' + p.ll.join('') + '）の取扱説明書】', g.att, g.pace];

      '<section class="sec"><h3>マンネリしたとき' + tag('standard') + '</h3><p>' + s.rut + '</p></section>' +
      '<section class="sec"><h3>嫉妬との付き合い方' + tag('standard') + '</h3><p>' + s.jealousy + '</p></section>' +
      '<section class="sec"><h3>失恋したとき' + tag('standard') + '</h3><p>' + s.afterBreakup + '</p></section>' +
      '<section class="sec"><h3>復縁したくなったら' + tag('standard') + '</h3><p>' + s.reunion + '</p></section>' +
      '<section class="sec"><h3>同棲・結婚を考えたとき' + tag('standard') + '</h3><p>' + s.marriage + '</p></section>' +
      '<section class="sec"><h3>マッチングアプリでの恋' + tag('standard') + '</h3><p>' + s.app + '</p></section>' +
      '<section class="sec"><h3>恋の段階別アドバイス' + tag('standard') + '</h3><div class="kv">' +
      kv('片思い', s.stages.crush) + kv('付き合いたて', s.stages.early) + kv('長く付き合っている', s.stages.long) + '</div></section>' +
      '<section class="sec"><h3>16タイプとの付き合いやすさ' + tag('standard') + '</h3>' +
      '<p class="note">★が少ない相手は「合わない」相手ではなく、すれ違いやすいところがはっきりしている相手です。同じ★の中では、ペースや判断の仕方が近い順に並んでいます。タイプ名をタップすると、その人と付き合うときのコツが開きます。</p>' +
      s.compat.map(function (g) {
        return '<div class="cgroup"><h4>' + LC.ATT[g.att].name + 'の人と <span class="st" aria-label="付き合いやすさ 5段階中' + g.ease + '">' + stars(g.ease * 20) + '</span></h4><p>' + g.text + '</p><div class="ranking">' + g.types.map(function (c) {
          var near = c.samePace && c.sameJudge ? 'ペースも判断の仕方も近い' : c.samePace ? 'ペースが近い' : c.sameJudge ? '判断の仕方が近い' : 'ペースも判断の仕方も違う';
          return '<details><summary><code>' + c.core + '</code><span class="nm">' + c.name + '</span><span class="near">' + near + '</span></summary><p>' + c.howto + '</p></details>';
        }).join('') + '</div></div>';
      }).join('') + '</section>' +
      (withTool ? '<section class="sec panel"><h3>相性チェック' + tag('standard') + '</h3>' +
        '<p class="muted">相手にも診断してもらい、そのコードを入れてください。愛情言語まで含めて見られます。</p>' +
        '<div class="compat-form"><input type="text" id="partner" placeholder="例：CKSM-A" aria-label="相手のラブコード" autocomplete="off"><button class="btn small" id="compat-go">相性を見る</button></div>' +
        '<div class="compat-out" id="compat-out"></div></section>' : '');
  }

  function togetherHtml(p, rep) {
    var t = rep.together, o = LC.parseCode(rep.partner.code);
    return '<section class="codecard pairhead" style="--qc:var(--accent)"><span class="eyebrow">2人の相性レポート' + tag('pair') + '</span>' +
      '<div class="pair-codes"><span>' + p.core + '-' + p.ll.join('') + '<small>' + LC.TYPES[p.core][0] + '</small></span><b>×</b><span>' + o.core + '-' + o.ll.join('') + '<small>' + LC.TYPES[o.core][0] + '</small></span></div>' +
      '<p>' + t.att + '</p></section>' +
      '<section class="sec"><h3>2人の間で起きやすいズレ' + tag('pair') + '</h3>' + list(t.gaps) + '</section>' +
      '<section class="sec"><h3>そのまま使える会話のテンプレ' + tag('pair') + '</h3>' + t.talks.map(function (x) {
        return '<div class="ask"><span class="who">' + x.who + '</span>「' + x.line + '」</div>';
      }).join('') + '</section>' +
      '<section class="sec"><h3>ペースとケンカの仕方' + tag('pair') + '</h3><div class="kv"><p>' + t.pace + '</p><p>' + t.judge + '</p></div></section>' +
      '<section class="sec"><h3>2人の愛情言語' + tag('pair') + '</h3><p>' + (t.ll.shared.length ? '二人に共通する愛情言語は「' + t.ll.shared.join('・') + '」です。' : '') + t.ll.summary + '</p>' +
      '<div class="kv">' + kv('あなたから相手へ', '<div class="kv">' + t.ll.toPartner.map(function (x) { return kv(x.name, x.action); }).join('') + '</div>') +
      kv('相手からあなたへ', '<div class="kv">' + t.ll.toYou.map(function (x) { return kv(x.name, x.action); }).join('') + '</div>') + '</div></section>' +
      '<section class="sec"><h3>2人におすすめの習慣' + tag('pair') + '</h3><p>' + t.ritual + '</p></section>';
  }

  function renderPremium(code, rep) {
    var p = LC.parseCode(code), el = document.getElementById('premium');
    var html = '';
    if (rep.together) html += togetherHtml(p, rep);
    html += '<h2 class="part">' + (rep.together ? 'あなたのレポート' : 'あなたのレポート（' + PLAN_INFO[rep.plan].name + '）') + '</h2>';
    html += selfHtml(p, rep.lite);
    if (rep.standard) html += standardHtml(p, rep.standard, true);
    if (rep.partner) {
      var o = LC.parseCode(rep.partner.code);
      html += '<details class="partner-report"><summary><h2 class="part">相手のレポート（' + rep.partner.code + '「' + LC.TYPES[o.core][0] + '」）</h2><span class="note">タップで開く</span></summary>' +
        '<div class="stack">' + selfHtml(o, rep.partner.lite) + standardHtml(o, rep.partner.standard, false) + '</div></details>';
    }
    el.innerHTML = '<div class="stack">' + html + '</div>';
    var go = document.getElementById('compat-go');
    if (go) go.onclick = function () {
      document.getElementById('compat-out').innerHTML = compat(p, rep.standard, normalize(document.getElementById('partner').value));
    };
    Array.prototype.forEach.call(el.querySelectorAll('.copy-guide'), function (btn) {
      btn.onclick = function () {
        var text = btn.dataset.text;
        var done = function () { btn.textContent = 'コピーしました'; };
        var fail = function () { var pre = document.createElement('pre'); pre.className = 'guide-text'; pre.textContent = text; btn.replaceWith(pre); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fail); else fail();
      };
    });
  }

  function compat(me, s, raw) {
    var o = LC.parseCode(raw);
    if (!o) return '<p class="err">コードの形が正しくありません。「CKSM-A」や「EOFH-WP」のように入力してください。</p>';
    var t = LC.TYPES[o.core];
    var paceKey = me.pace[0] === o.pace[0] ? (me.pace[0] === 'F' ? 'sameF' : 'sameS') : 'diffF';
    var judgeKey = me.pace[1] === o.pace[1] ? (me.pace[1] === 'H' ? 'sameH' : 'sameM') : 'diffH';
    var shared = me.ll.filter(function (k) { return o.ll.indexOf(k) >= 0; });
    var llText = shared.length
      ? '「' + llNames(shared) + '」が、二人に共通する愛情言語です。そこを意識して増やすだけで、お互いの満足度が上がりやすいペアです。'
      : '共通の愛情言語がない二人です。あなたが' + llNames(me.ll) + 'で愛を伝えても、相手には届きにくいかもしれません。相手には「' + s.actions[o.ll[0]] + '」を試してみてください。逆に、相手からの愛は' + llNames(o.ll) + 'の形で届いているかもしれません。それも愛情だと気づいてあげてください。';
    return '<p><strong>相手は ' + o.core + '-' + o.ll.join('') + '「' + t[0] + '」</strong>、' + LC.ATT[o.att].name + 'です。</p>' +
      '<div class="kv">' + kv('不安のクセの相性', s.attPairs[o.att]) + kv('ペース', s.pacePairs[paceKey]) + kv('ケンカのとき', s.pacePairs[judgeKey]) + kv('愛情言語', llText) + '</div>' +
      '<p class="note">2人だけのズレの具体例や会話のテンプレは、ペアプランで読めます。</p>';
  }

  // ---------- boot ----------
  function boot() {
    API.plans().then(function (p) { plans = p; route(); }).catch(function () {
      app.innerHTML = '<p class="err">読み込みに失敗しました。ページを再読み込みしてください。</p>';
    });
  }
  function route() {
    var sid = null;
    try { sid = new URLSearchParams(location.search).get('session_id'); } catch (e) { sid = null; }
    if (sid) {
      app.innerHTML = '<p class="muted">お支払いを確認しています…</p>';
      API.report(sid).then(function (rep) {
        if (rep && rep.code) { savePaid(rep.code, sid, rep.plan); setHash(rep.code); showResult(rep.code, null); return; }
        app.innerHTML = '<section class="panel"><p class="err">' + ((rep && rep.error) || '購入情報を確認できませんでした') + '</p>' +
          '<p class="note">コンビニ払いなどでお支払いが完了していない場合は、完了後にこのページを開き直してください。</p><div><button class="btn small" id="top">トップへ</button></div></section>';
        document.getElementById('top').onclick = renderIntro;
      });
      return;
    }
    var code = (location.hash || '').slice(1);
    if (LC.parseCode(code)) showResult(code, null); else renderIntro();
  }
  boot();
})();

</script>
